# EXAMPLE — do not commit real values. Prefer an external secrets operator
# (External Secrets, Vault, SOPS) over a plain Secret in production.
apiVersion: v1
kind: Secret
metadata:
  name: agentforge-secrets
type: Opaque
stringData:
  AGENTFORGE_DATABASE_URL: postgresql+asyncpg://agentforge:CHANGE_ME@postgres.data:5432/agentforge
  AGENTFORGE_REDIS_URL: redis://redis.data:6379/0
  AGENTFORGE_JWT_SECRET: CHANGE_ME_32_BYTE_RANDOM
  AGENTFORGE_API_KEY_PEPPER: CHANGE_ME_RANDOM
  AGENTFORGE_ANTHROPIC_API_KEY: ""
  AGENTFORGE_OPENAI_API_KEY: ""
