apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforge-api
  labels: { app.kubernetes.io/name: agentforge, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: agentforge, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentforge, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: agentforge
          args: ["api"]
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: agentforge-config }
            - secretRef: { name: agentforge-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/component: api }
