apiVersion: v1
kind: ConfigMap
metadata:
  name: agentforge-config
data:
  AGENTFORGE_ENVIRONMENT: production
  AGENTFORGE_LOG_LEVEL: INFO
  AGENTFORGE_LOG_JSON: "true"
  AGENTFORGE_MODEL_REGISTRY_PATH: config/models.yaml
  AGENTFORGE_LEASE_SECONDS: "30"
  AGENTFORGE_LEASE_HEARTBEAT_SECONDS: "10"
  AGENTFORGE_MAX_CONCURRENT_STEPS_PER_WORKER: "8"
  AGENTFORGE_ORG_DAILY_BUDGET_USD: "500"
  AGENTFORGE_WORKER_METRICS_PORT: "9100"
  AGENTFORGE_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
  AGENTFORGE_OTEL_SERVICE_NAME: agentforge
