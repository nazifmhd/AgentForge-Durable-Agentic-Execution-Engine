global:
  scrape_interval: 10s

scrape_configs:
  - job_name: agentforge-api
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  # Set AGENTFORGE_WORKER_METRICS_PORT=9100 on the worker to expose this.
  - job_name: agentforge-worker
    static_configs:
      - targets: ["host.docker.internal:9100"]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
